<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KiddoTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --txt: #0f0f0f;
    --txt2: #606060;
    --bg: #ffffff;
    --chip: #f2f2f2;
    --chip-hover: #e5e5e5;
    --line: #e5e5e5;
    --red: #ff0000;
  }

  body {
    font-family: 'Roboto', Arial, sans-serif;
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
  }
  button { font-family: inherit; }

  /* ── Header ─────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 60;
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 16px;
    background: var(--bg);
  }
  .iconbtn {
    border: none; background: transparent; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center;
  }
  .iconbtn:hover { background: var(--chip); }
  .iconbtn svg { width: 24px; height: 24px; fill: var(--txt); }

  .logo {
    display: flex; align-items: center; gap: 4px;
    border: none; background: transparent; cursor: pointer;
    padding: 0 8px; user-select: none;
  }
  .logo svg { width: 30px; height: 21px; }
  .logo span {
    font-size: 20px; font-weight: 700; letter-spacing: -1px;
    color: var(--txt); font-family: 'Roboto', Arial, sans-serif;
  }

  #searchWrap {
    flex: 1; max-width: 640px; margin: 0 auto;
    display: flex; align-items: center; height: 40px;
  }
  #searchInput {
    flex: 1; height: 100%; min-width: 0;
    padding: 0 16px; font-size: 16px; font-family: inherit;
    border: 1px solid #ccc; border-right: none;
    border-radius: 20px 0 0 20px; outline: none;
    color: var(--txt); background: var(--bg);
  }
  #searchInput:focus { border-color: #1c62b9; }
  #searchBtn {
    width: 64px; height: 100%; cursor: pointer;
    border: 1px solid #ccc; border-radius: 0 20px 20px 0;
    background: #f8f8f8;
    display: grid; place-items: center;
  }
  #searchBtn:hover { background: #f0f0f0; }
  #searchBtn svg { width: 22px; height: 22px; fill: var(--txt); }

  #avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: #7c4dff; color: #fff;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 500;
    margin-left: 8px; user-select: none;
  }

  /* ── Layout: mini sidebar + content ─────── */
  #page { display: flex; }
  #sidebar {
    width: 72px; flex-shrink: 0;
    position: sticky; top: 56px; align-self: flex-start;
    display: flex; flex-direction: column; padding: 4px;
  }
  .navbtn {
    border: none; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px 0 14px; border-radius: 10px;
    font-size: 10px; color: var(--txt);
  }
  .navbtn:hover { background: var(--chip); }
  .navbtn svg { width: 24px; height: 24px; fill: var(--txt); }
  .navbtn .on { display: none; }
  .navbtn.active .on { display: block; }
  .navbtn.active .off { display: none; }
  .navbtn.active { font-weight: 500; }

  #content { flex: 1; min-width: 0; }

  /* ── Chips row ──────────────────────────── */
  #chips {
    position: sticky; top: 56px; z-index: 50;
    display: flex; gap: 12px; align-items: center;
    padding: 4px 16px 12px;
    background: var(--bg);
    overflow-x: auto; scrollbar-width: none;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    border: none; cursor: pointer; flex-shrink: 0;
    padding: 0 12px; height: 32px; border-radius: 8px;
    background: var(--chip); color: var(--txt);
    font-size: 14px; font-weight: 500;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip.active { background: var(--txt); color: var(--bg); }

  /* ── Video grid (home) ──────────────────── */
  main { padding: 8px 16px 32px; }
  .grid {
    display: grid; gap: 40px 16px;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  }
  .grid.reels { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 28px 16px; }

  .card {
    border: none; background: transparent; padding: 0;
    text-align: left; cursor: pointer;
  }
  .thumb {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 12px; overflow: hidden; background: var(--chip);
  }
  .reels .thumb { aspect-ratio: 9 / 16; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card:hover .thumb { border-radius: 0; transition: border-radius .2s .15s; }

  .cinfo { display: flex; gap: 12px; padding: 12px 0 0; }
  .cavatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    color: #fff; display: grid; place-items: center;
    font-size: 16px; font-weight: 500; user-select: none;
  }
  .ctitle {
    font-size: 16px; font-weight: 500; line-height: 22px; color: var(--txt);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cch { font-size: 14px; color: var(--txt2); margin-top: 4px; }
  .reels .ctitle { font-size: 14px; line-height: 20px; }
  .reels .cinfo { padding-top: 8px; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--txt2); font-size: 16px; }
  .hidden { display: none !important; }

  /* ── Bottom nav (mobile) ────────────────── */
  #bottomnav {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    height: 56px; background: var(--bg); border-top: 1px solid var(--line);
  }
  #bottomnav .navbtn { flex: 1; padding: 6px 0; border-radius: 0; gap: 2px; }

  /* ── Watch page ─────────────────────────── */
  #watch { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .watch-layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 400px;
    gap: 24px; align-items: start;
  }
  #watchTitle { font-size: 20px; font-weight: 700; line-height: 28px; margin: 12px 0 8px; }

  .wchrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  #wchAvatar {
    width: 40px; height: 40px; border-radius: 50%;
    color: #fff; display: grid; place-items: center;
    font-size: 18px; font-weight: 500; user-select: none;
  }
  #wchName { font-size: 16px; font-weight: 500; }
  .subbtn {
    border: none; cursor: pointer;
    height: 36px; padding: 0 16px; border-radius: 18px;
    background: var(--txt); color: var(--bg);
    font-size: 14px; font-weight: 500;
    margin-left: 12px;
  }
  .wacts { display: flex; gap: 8px; margin-left: auto; }
  .pill {
    border: none; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 18px;
    background: var(--chip); color: var(--txt);
    font-size: 14px; font-weight: 500;
  }
  .pill:hover { background: var(--chip-hover); }
  .pill svg { width: 20px; height: 20px; fill: var(--txt); }
  .pill.liked { background: #fce8e8; }
  .pill.liked svg { fill: var(--red); }

  .upnext h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
  .unrow {
    display: flex; gap: 8px; width: 100%;
    padding: 4px; border: none; border-radius: 10px;
    background: transparent; cursor: pointer; text-align: left;
  }
  .unrow:hover { background: var(--chip); }
  .unrow img {
    width: 168px; aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 8px; flex-shrink: 0; background: var(--chip);
  }
  .unrow .t {
    font-size: 14px; font-weight: 500; line-height: 20px; color: var(--txt);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .unrow .c { font-size: 12px; color: var(--txt2); margin-top: 4px; }
  .unrow .np { display: none; font-size: 12px; font-weight: 500; color: var(--red); margin-top: 4px; }
  .unrow.playing { background: var(--chip); }
  .unrow.playing .np { display: block; }

  /* ── Player stage (watch) ───────────────── */
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border-radius: 12px; overflow: hidden;
  }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  #shield { position: absolute; inset: 0; z-index: 2; touch-action: none; }

  .bar {
    position: absolute; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 12px;
    transition: opacity .25s;
  }
  .stage.hide-ui .bar { opacity: 0; pointer-events: none; }

  /* YouTube-style control bar */
  #botbar {
    bottom: 0; flex-direction: column; align-items: stretch; gap: 0;
    padding: 0 10px 2px;
    background: linear-gradient(transparent, rgba(0,0,0,.8));
  }
  #seek {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; margin: 10px 0 2px;
    border-radius: 0; cursor: pointer;
    background: rgba(255,255,255,.3);
    accent-color: var(--red);
  }
  #seek:hover { height: 5px; }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--red); border: none;
    opacity: 0; transition: opacity .1s;
  }
  #botbar:hover #seek::-webkit-slider-thumb, #seek:active::-webkit-slider-thumb { opacity: 1; }
  #ybtns { display: flex; align-items: center; gap: 2px; }
  .ybtn {
    border: none; background: transparent; cursor: pointer;
    width: 46px; height: 42px; padding: 0;
    display: grid; place-items: center;
    opacity: .9; transition: opacity .1s;
  }
  .ybtn:hover { opacity: 1; }
  .ybtn svg { width: 24px; height: 24px; fill: #fff; }
  #playBtn svg { width: 34px; height: 34px; }
  #playBtn .ico-play { display: none; }
  #playBtn.is-paused .ico-play { display: block; }
  #playBtn.is-paused .ico-pause { display: none; }
  #fsBtn { margin-left: auto; }
  #fsBtn .ico-exit { display: none; }
  #fsBtn.is-fs .ico-exit { display: block; }
  #fsBtn.is-fs .ico-enter { display: none; }
  .stage.fake-fs {
    position: fixed !important; inset: 0; z-index: 300;
    width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0;
  }
  .stage:fullscreen { border-radius: 0; }
  #timeLbl {
    color: #fff; font-size: 13px; font-weight: 400;
    margin-left: 8px; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }

  /* Big center play button, styled like YouTube's */
  #bigPlay {
    position: absolute; inset: 0; z-index: 2; margin: auto;
    width: 68px; height: 48px; border-radius: 12px;
    border: none; cursor: pointer;
    background: rgba(33, 33, 33, .85);
    display: grid; place-items: center;
    transition: background .1s;
  }
  #bigPlay:hover { background: var(--red); }
  #bigPlay svg { width: 30px; height: 30px; fill: #fff; }

  /* ── Shorts overlay ─────────────────────── */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    background: #000; overflow: hidden;
    touch-action: none; overscroll-behavior: contain;
  }
  #track {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    will-change: transform;
  }
  #track.anim { transition: transform .28s cubic-bezier(.2, .7, .3, 1); }
  .spanel {
    position: absolute; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
  }
  .shorts-mode .spanel { display: flex; }
  .spanel.pos-prev { top: -100%; }
  .spanel.pos-cur { top: 0; }
  .spanel.pos-next { top: 100%; }
  .sbox {
    position: relative; overflow: hidden;
    width: min(100vw, 56.25vh); aspect-ratio: 9 / 16;
    background: #111;
  }
  .sbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sposter { position: absolute; inset: 0; z-index: 1; background: #111; }
  .sposter img { width: 100%; height: 100%; object-fit: cover; }
  .sposter .spinner {
    position: absolute; inset: 0; margin: auto;
    width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.25); border-top-color: var(--red);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Shorts chrome: shield, back, right-side action rail, thin progress bar */
  #shortsUI { display: none; }
  .shorts-mode #shortsUI { display: block; }
  #sShield { position: absolute; inset: 0; z-index: 2; touch-action: none; }
  /* Our own Shorts-style pause indicator: opaque enough to fully mask
     YouTube's centered play button inside the iframe */
  #sPause {
    position: absolute; inset: 0; margin: auto; z-index: 3;
    width: 96px; height: 96px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(18, 18, 18, .92);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: grid; place-items: center;
  }
  #sPause svg { width: 44px; height: 44px; fill: #fff; }
  #srail {
    position: absolute; z-index: 3;
    right: calc(50% - min(50vw, 28.125vh) + 8px);
    bottom: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .railbtn {
    border: none; cursor: pointer;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,.15);
    display: grid; place-items: center;
  }
  .railbtn:hover { background: rgba(255,255,255,.3); }
  .railbtn svg { width: 24px; height: 24px; fill: #fff; }
  .railbtn.liked { background: #fff; }
  .railbtn.liked svg { fill: var(--red); }
  #shortsBar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 3;
    background: rgba(255,255,255,.2);
  }
  #shortsFill { height: 100%; width: 0%; background: var(--red); }

  /* ── Toast & warning banner ─────────────── */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 400; max-width: min(90vw, 480px);
    background: #212121; color: #fff;
    font-size: 14px; line-height: 1.4;
    padding: 12px 20px; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }
  #warnBanner {
    background: #fff3cd; color: #7a5c00;
    border-bottom: 2px solid #ffe08a;
    padding: 12px 20px; font-size: 14px; line-height: 1.5;
  }
  #warnBanner code { background: #ffe9a8; padding: 2px 6px; border-radius: 6px; font-size: 13px; }

  /* ── Responsive ─────────────────────────── */
  @media (max-width: 900px) {
    #sidebar { display: none; }
    #bottomnav { display: flex; }
    main { padding-bottom: 88px; }
    #watch { padding: 0 0 72px; }
    .watch-layout { grid-template-columns: 1fr; gap: 0; }
    .stage { border-radius: 0; position: sticky; top: 0; z-index: 55; }
    #watchTitle { margin: 12px 16px 8px; font-size: 17px; line-height: 24px; }
    .wchrow { margin: 0 16px 8px; }
    .wacts { margin-left: 0; width: 100%; }
    .upnext { padding: 8px 12px; }
    /* keep the bottom nav in watch mode — with no back button, it's the way out */
    body.watch-mode header, body.watch-mode #chips { display: none; }
  }
  @media (max-width: 600px) {
    header { padding: 0 8px; }
    #searchWrap { margin: 0 4px; }
    .logo span { font-size: 17px; }
    main { padding-left: 0; padding-right: 0; }
    #chips { top: 56px; }
    .grid { gap: 24px 0; grid-template-columns: 1fr; }
    .grid .thumb { border-radius: 0; }
    .grid .cinfo { padding: 12px 12px 0; }
    .grid.reels { grid-template-columns: repeat(2, 1fr); gap: 16px 4px; padding: 0 4px; }
    .grid.reels .thumb { border-radius: 8px; }
    .grid.reels .cinfo { padding: 8px 8px 0; }
    .empty { padding: 40px 16px; }
  }
</style>
</head>
<body>

<div id="warnBanner" class="hidden">
  ⚠️ <strong>This page was opened as a file</strong>, so YouTube refuses to play videos
  (error 153 — it can't verify which website is embedding them).
  Serve it over HTTP instead: run <code>python3 -m http.server 8080</code> in this folder,
  then open <code>http://localhost:8080</code>.
</div>

<header>
  <button class="iconbtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <button class="logo" id="logoBtn" aria-label="Home">
    <svg viewBox="0 0 30 21"><rect width="30" height="21" rx="5" fill="#f00"/><path d="M12 5.5v10l8.5-5z" fill="#fff"/></svg>
    <span id="siteName"></span>
  </button>
  <div id="searchWrap">
    <input id="searchInput" type="search" placeholder="Search" autocomplete="off">
    <button id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></button>
  </div>
  <div id="avatar">K</div>
</header>

<div id="page">
  <div id="sidebar">
    <button class="navbtn active" data-view="home">
      <svg class="on" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M12 5.7l5 4.5V18h-2v-6H9v6H7v-7.8l5-4.5M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
      <span>Home</span>
    </button>
    <button class="navbtn" data-view="shorts">
      <svg class="on" viewBox="0 0 24 24"><path d="M17.77 10.32l-1.6-.83L17.5 8.7a4 4 0 0 0-3.9-6.94L5.9 5.9a4 4 0 0 0 .33 7.78l1.6.83-1.33.79a4 4 0 0 0 3.9 6.94l7.7-4.14a4 4 0 0 0-.33-7.78zM10 14.5v-5l4.5 2.5z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M17.77 10.32l-1.6-.83L17.5 8.7a4 4 0 0 0-3.9-6.94L5.9 5.9a4 4 0 0 0 .33 7.78l1.6.83-1.33.79a4 4 0 0 0 3.9 6.94l7.7-4.14a4 4 0 0 0-.33-7.78zM10 14.5v-5l4.5 2.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Shorts</span>
    </button>
  </div>

  <div id="content">
    <div id="chips"></div>
    <main id="mainView">
      <div id="videoGrid" class="grid"></div>
      <div id="reelGrid" class="grid reels hidden"></div>
    </main>

    <div id="watch" class="hidden">
      <div class="watch-layout">
        <div class="watch-main">
          <div class="stage" id="stage">
            <div id="yt"></div>
            <div id="shield"></div>
            <button id="bigPlay" class="hidden" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            <div class="bar" id="botbar">
              <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
              <div id="ybtns">
                <button class="ybtn" id="prevBtn" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="ybtn" id="playBtn" aria-label="Play/Pause">
                  <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  <svg class="ico-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="ybtn" id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <span id="timeLbl">0:00 / 0:00</span>
                <button class="ybtn" id="fsBtn" aria-label="Fullscreen">
                  <svg class="ico-enter" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                  <svg class="ico-exit" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                </button>
              </div>
            </div>
          </div>
          <h1 id="watchTitle"></h1>
          <div class="wchrow">
            <span id="wchAvatar"></span>
            <span id="wchName"></span>
            <button class="subbtn">Subscribe</button>

let toastTimer = null;
function showToast(msg, ms = 3500) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ── Channel avatars ── */
const AV_COLORS = ['#e53935','#8e24aa','#3949ab','#039be5','#00897b','#7cb342','#fb8c00','#6d4c41','#d81b60','#00acc1','#5e35b1'];
const CHANNELS = [...new Set([...VIDEOS, ...REELS].map(v => v.ch).filter(Boolean))];
function chColor(ch) {
  const i = CHANNELS.indexOf(ch);
  return AV_COLORS[(i >= 0 ? i : 0) % AV_COLORS.length];
}

/* ── Grids + chips + search ── */
let activeChip = 'All', query = '';

function matches(v) {
  if (activeChip !== 'All' && v.ch !== activeChip) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return v.title.toLowerCase().includes(q) || (v.ch || '').toLowerCase().includes(q);
}

function buildGrid(el, list, mode) {
  el.innerHTML = '';
  const rows = list.map((v, i) => ({ v, i })).filter(r => matches(r.v));
  if (!rows.length) {
    el.innerHTML = '<div class="empty">No videos found 🌈</div>';
    return;
  }
  rows.forEach(({ v, i }) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML =
      '<div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg"></div>' +
      '<div class="cinfo">' +
        (mode === 'videos' ? '<span class="cavatar"></span>' : '') +
        '<div><div class="ctitle"></div><div class="cch"></div></div>' +
      '</div>';
    card.querySelector('.ctitle').textContent = v.title;
    card.querySelector('.cch').textContent = v.ch || '';
    const av = card.querySelector('.cavatar');
    if (av) { av.textContent = (v.ch || '?')[0]; av.style.background = chColor(v.ch); }
    card.addEventListener('click', () => openPlayer(mode === 'reels' ? 'reels' : 'videos', i));
    el.appendChild(card);
  });
}

function renderGrids() {
  buildGrid($('videoGrid'), VIDEOS, 'videos');
  buildGrid($('reelGrid'), REELS, 'reels');
}

function buildChips() {
  const c = $('chips');
  c.innerHTML = '';
  ['All', ...CHANNELS].forEach(name => {
    const b = document.createElement('button');
    b.className = 'chip' + (name === activeChip ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', () => {
      activeChip = name;
      [...c.children].forEach(el => el.classList.toggle('active', el.textContent === name));
      renderGrids();
    });
    c.appendChild(b);
  });
}

$('searchInput').addEventListener('input', (e) => { query = e.target.value.trim(); renderGrids(); });
$('searchBtn').addEventListener('click', () => { query = $('searchInput').value.trim(); renderGrids(); });

buildChips();
renderGrids();

/* ── Navigation (sidebar + bottom nav) ── */
function navTo(view) {
  if (!$('watch').classList.contains('hidden')) closePlayer();
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('videoGrid').classList.toggle('hidden', view !== 'home');
  $('reelGrid').classList.toggle('hidden', view !== 'shorts');
  window.scrollTo(0, 0);
}
document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => navTo(b.dataset.view)));
$('logoBtn').addEventListener('click', () => navTo('home'));

/* ── YouTube IFrame API ── */
let player = null, apiReady = false, playerReady = false;
let queue = [], qIndex = 0, ticker = null, hideTimer = null, pendingOpen = null;
let currentMode = 'videos';

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  apiReady = true;
  if (pendingOpen) { const p = pendingOpen; pendingOpen = null; openPlayer(p.mode, p.index); }
}

// Error 153 fix: YouTube requires knowing the embedding site's origin
function baseVars(autoplay) {
  return {
    autoplay: autoplay ? 1 : 0, rel: 0, playsinline: 1,
    controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
    ...(location.protocol.startsWith('http')
      ? { origin: location.origin, widget_referrer: location.href }
      : {}),
  };
}

function openPlayer(mode, index) {
  if (!apiReady) { pendingOpen = { mode, index }; return; }
  if (mode === 'reels') { openShorts(index); return; }
  openWatch(index);
}

/* ── Watch page ── */
function openWatch(index) {
  queue = VIDEOS; qIndex = index; currentMode = 'videos';
  armHistory();
  document.body.classList.add('watch-mode');
  $('mainView').classList.add('hidden');
  $('watch').classList.remove('hidden');
  syncWatchInfo();
  buildUpNext();
  window.scrollTo(0, 0);

  if (!player) {
    player = new YT.Player('yt', {
      host: 'https://www.youtube-nocookie.com',
      videoId: queue[qIndex].id,
      playerVars: baseVars(true),
      events: {
        onReady: () => { playerReady = true; startCurrent(); },
        onStateChange: onState,
        onError: onPlayerError,
      },
    });
  } else if (playerReady) {
    startCurrent();
  }
}

function syncWatchInfo() {
  const v = queue[qIndex];
  $('watchTitle').textContent = v.title;
  $('wchName').textContent = v.ch || SITE_NAME;
  $('wchAvatar').textContent = (v.ch || '?')[0];
  $('wchAvatar').style.background = chColor(v.ch);
  $('likeBtn').classList.remove('liked');
}

function buildUpNext() {
  const c = $('upNextList');
  c.innerHTML = '';
  VIDEOS.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'unrow';
    b.innerHTML = '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg">' +
      '<div><div class="t"></div><div class="c"></div><div class="np">▶ Now playing</div></div>';
    b.querySelector('.t').textContent = v.title;
    b.querySelector('.c').textContent = v.ch || '';
    b.addEventListener('click', () => {
      if (i !== qIndex) { qIndex = i; startCurrent(); window.scrollTo(0, 0); }
    });
    c.appendChild(b);
  });
  updateUpNextHighlight();
}

function updateUpNextHighlight() {
  Array.from($('upNextList').children).forEach((el, i) => el.classList.toggle('playing', i === qIndex));
}

function shortsThumb(img, id) {
  img.onerror = () => { img.onerror = null; img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; };
  img.src = 'https://i.ytimg.com/vi/' + id + '/oardefault.jpg';  // vertical Shorts thumbnail
}

function startCurrent() {
  syncWatchInfo();
  updateUpNextHighlight();
  player.loadVideoById(v.id);
  showUi();
  if (!ticker) ticker = setInterval(tick, 400);
}

/* ── Shorts engine: three players (prev/current/next), neighbors preloaded
      muted & paused at frame zero so a swipe starts playback instantly ── */
const S = { panels: [], inited: false, readyCount: 0 };
let roles = [0, 1, 2];   // S.panels index occupying the [prev, current, next] slot
let sUserPaused = false; // only a user tap may show the pause indicator — internal preload pauses must not

/* Shorts feed order: swipe up = a pre-picked random short (no repeats until the
   whole pool is seen), swipe down = back through watch history */
let sHist = [], sPos = 0, pendingNext = 0, sBag = [];
function nextRandomIdx() {
  if (!sBag.length) {
    sBag = REELS.map((_, i) => i);
    for (let i = sBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [sBag[i], sBag[j]] = [sBag[j], sBag[i]];
    }
  }
  // never serve the currently playing short as "next"
  if (sBag[sBag.length - 1] === sHist[sPos] && sBag.length > 1) {
    sBag.unshift(sBag.pop());
  }
  return sBag.pop();
}

function applyPos() {
  const cls = ['pos-prev', 'pos-cur', 'pos-next'];
  roles.forEach((pi, slot) => {
    const el = S.panels[pi].el;
    el.classList.remove('pos-prev', 'pos-cur', 'pos-next');
    el.classList.add(cls[slot]);
  });
}

function setPoster(pan, id) {
  shortsThumb(pan.el.querySelector('.sposter img'), id);
  pan.el.querySelector('.sposter').classList.remove('hidden');
}
function hidePoster(pan) { pan.el.querySelector('.sposter').classList.add('hidden'); }

function clearPanel(pan) {  // used for the "previous" slot when history is empty
  pan.mode = 'off'; pan.id = null; pan.ready = false;
  if (pan.p && typeof pan.p.pauseVideo === 'function') { pan.p.mute(); pan.p.pauseVideo(); }
  const img = pan.el.querySelector('.sposter img');
  img.onerror = null; img.removeAttribute('src');
  pan.el.querySelector('.sposter').classList.remove('hidden');
}

function initShorts(cb) {
  if (S.inited) { cb(); return; }
  S.inited = true;
  let called = false;
  const fire = () => { if (!called) { called = true; cb(); } };
  [['shA', 'spA'], ['shB', 'spB'], ['shC', 'spC']].forEach(([hostId, panelId]) => {
    const pan = { el: $(panelId), p: null, id: null, mode: 'off', ready: false, error: false };
    S.panels.push(pan);
    pan.p = new YT.Player(hostId, {
      host: 'https://www.youtube-nocookie.com',
      playerVars: baseVars(false),
      events: {
        onReady: () => { if (++S.readyCount >= 3) fire(); },
        onStateChange: (e) => onSState(pan, e),
        onError: () => onSError(pan),
      },
    });
  });
  setTimeout(fire, 4000);   // safety: don't hang if one player never reports ready
}

function goLive(pan, id) {
  pan.mode = 'live';
  if (pan.id === id && pan.ready && !pan.error) {
    pan.p.unMute(); pan.p.playVideo();      // already buffered: instant start
  } else {
    pan.id = id; pan.ready = false; pan.error = false;
    setPoster(pan, id);
    pan.p.unMute();
    pan.p.loadVideoById(id);
  }
}

function preload(pan, id) {
  pan.mode = 'preload';
  setPoster(pan, id);
  pan.p.mute();
  if (pan.id === id && !pan.error) {        // still buffered from an earlier play
    pan.p.pauseVideo(); pan.p.seekTo(0, true); pan.ready = true;
    return;
  }
  pan.id = id; pan.ready = false; pan.error = false;
  pan.p.loadVideoById(id);                  // muted; paused at 0 on first PLAYING
}

function onSState(pan, e) {
  if (e.data === YT.PlayerState.PLAYING) {
    if (pan.mode === 'preload') { pan.p.pauseVideo(); pan.p.seekTo(0, true); pan.ready = true; }
    else if (pan.mode === 'live') { errStreak = 0; hidePoster(pan); sUserPaused = false; $('sPause').classList.add('hidden'); }
  } else if (e.data === YT.PlayerState.PAUSED && pan.mode === 'live' && currentMode === 'reels' && sUserPaused) {
    $('sPause').classList.remove('hidden');     // masks YouTube's own play button
  } else if (e.data === YT.PlayerState.ENDED && pan.mode === 'live') {
    pan.p.seekTo(0, true); pan.p.playVideo();   // Shorts loop
  }
}

function onSError(pan) {
  pan.error = true;
  if (pan.mode !== 'live') return;   // failed preload; dealt with if it ever goes live
  errStreak++;
  if (errStreak >= 3) {
    showToast('Videos are not loading — check the internet connection.', 6000);
    closePlayer(); errStreak = 0;
    return;
  }
  showToast('That one would not play — skipping.');
  setTimeout(() => commitSwipe(1), 350);
}

function openShorts(index) {
  currentMode = 'reels';
  armHistory();
  sHist = [index]; sPos = 0;
  $('overlay').classList.remove('hidden');
  $('overlay').classList.add('shorts-mode');
  document.body.style.overflow = 'hidden';
  $('shortsFill').style.width = '0%';
  $('sLike').classList.remove('liked');
  sUserPaused = false;
  $('sPause').classList.add('hidden');
  initShorts(() => {
    applyPos();
    goLive(S.panels[roles[1]], REELS[index].id);
    if (REELS.length > 1) {
      pendingNext = nextRandomIdx();
      preload(S.panels[roles[2]], REELS[pendingNext].id);
      clearPanel(S.panels[roles[0]]);   // no history yet — nothing behind us
    }
    if (!ticker) ticker = setInterval(tick, 400);
  });
}

let errStreak = 0;
function onPlayerError(e) {
  errStreak++;
  if (errStreak >= 3) {
    showToast('Videos are not loading — check the internet connection' +
      (location.protocol === 'file:' ? ', and open this site through http:// (see the yellow banner)' : '') + '.', 6000);
    closePlayer();
    errStreak = 0;
    return;
  }
  showToast('"' + (queue[qIndex] ? queue[qIndex].title : 'Video') + '" would not play (error ' + e.data + ') — skipping.');
  next();
}

function onState(e) {
  if (e.data === YT.PlayerState.ENDED) {
    // Intercept the end so YouTube's related-videos screen never appears
    if (AUTOPLAY_NEXT && qIndex < queue.length - 1) next();
    else closePlayer();
  } else if (e.data === YT.PlayerState.PLAYING) {
    errStreak = 0;
    $('playBtn').classList.remove('is-paused');
    $('bigPlay').classList.add('hidden');
    scheduleHide();
  } else if (e.data === YT.PlayerState.PAUSED) {
    $('playBtn').classList.add('is-paused');
    $('bigPlay').classList.remove('hidden');
    showUi();
  }
}

function next() { qIndex = (qIndex + 1) % queue.length; startCurrent(); }
function prev() { qIndex = (qIndex - 1 + queue.length) % queue.length; startCurrent(); }

function togglePlay() {
  if (!playerReady) return;
  const s = player.getPlayerState();
  if (s === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}

function closePlayer() {
  if (currentMode === 'reels') {
    S.panels.forEach((pan) => {
      if (pan.p && typeof pan.p.pauseVideo === 'function') { pan.p.mute(); pan.p.pauseVideo(); }
      pan.mode = 'off';
    });
    $('overlay').classList.add('hidden');
    $('overlay').classList.remove('shorts-mode');
    $('track').classList.remove('anim');
    $('track').style.transform = '';
    document.body.style.overflow = '';
  } else {
    if (playerReady) player.stopVideo();
    exitAnyFs();
    $('watch').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    document.body.classList.remove('watch-mode');
  }
  clearInterval(ticker); ticker = null;
  if (historyArmed && !closingFromPop) { historyArmed = false; history.back(); }
}

/* ── Progress ── */
let seeking = false;
function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  const m = Math.floor(s / 60), sec = String(s % 60).padStart(2, '0');
  return m + ':' + sec;
}
function tick() {
  if (currentMode === 'reels') {
    const pan = S.panels[roles[1]];
    if (!pan || !pan.p || typeof pan.p.getDuration !== 'function') return;
    const d = pan.p.getDuration() || 0, t = pan.p.getCurrentTime() || 0;
    $('shortsFill').style.width = (d > 0 ? (t / d) * 100 : 0) + '%';
    return;
  }
  if (!playerReady || seeking) return;
  const d = player.getDuration() || 0, t = player.getCurrentTime() || 0;
  if (d > 0) $('seek').value = (t / d) * 100;
  $('timeLbl').textContent = fmt(t) + ' / ' + fmt(d);
}
$('seek').addEventListener('input', () => { seeking = true; });
$('seek').addEventListener('change', () => {
  if (playerReady) {
    const d = player.getDuration() || 0;
    player.seekTo(d * ($('seek').value / 100), true);
  }
  seeking = false;
});

/* ── Controls auto-hide (watch player) ── */
function showUi() {
  $('stage').classList.remove('hide-ui');
  scheduleHide();
}
function scheduleHide() {
  clearTimeout(hideTimer);
  if (currentMode === 'reels') return;
  hideTimer = setTimeout(() => {
    if (playerReady && player.getPlayerState() === YT.PlayerState.PLAYING) {
      $('stage').classList.add('hide-ui');
    }
  }, 3000);
}

/* ── Shorts swipe navigation (touch drag, mouse drag, wheel, arrow keys) ── */
const track = $('track'), overlayEl = $('overlay');
let dragStartY = null, suppressClick = false, wheelLock = false, animating = false;

function commitSwipe(dir) {  // 1 = swipe up (random next), -1 = swipe down (history back)
  if (animating || REELS.length < 2 || !S.inited || (dir === -1 && sPos === 0)) {
    track.classList.add('anim'); track.style.transform = 'translateY(0)';
    return;   // at the first short, swiping down just bounces back
  }
  animating = true;
  const outPan = S.panels[roles[1]];
  const inPan = S.panels[roles[dir === 1 ? 2 : 0]];
  // a stale pre-pick can collide with the current short after back-and-forth navigation
  if (dir === 1 && sPos === sHist.length - 1 && pendingNext === sHist[sPos]) pendingNext = nextRandomIdx();
  const targetIdx = dir === 1
    ? (sPos < sHist.length - 1 ? sHist[sPos + 1] : pendingNext)
    : sHist[sPos - 1];
  outPan.mode = 'off'; outPan.p.mute(); outPan.p.pauseVideo();
  $('shortsFill').style.width = '0%';
  $('sLike').classList.remove('liked');
  sUserPaused = false;
  $('sPause').classList.add('hidden');
  goLive(inPan, REELS[targetIdx].id);     // preloaded neighbor: starts instantly
  track.classList.add('anim');
  track.style.transform = 'translateY(' + (dir === 1 ? '-100%' : '100%') + ')';
  let fired = false;
  const done = () => {
    if (fired) return;
    fired = true;
    track.removeEventListener('transitionend', done);
    // rotate panel roles so the slid-in player becomes "current", then refill the far slot
    roles = dir === 1 ? [roles[1], roles[2], roles[0]] : [roles[2], roles[0], roles[1]];
    applyPos();
    track.classList.remove('anim');
    track.style.transform = 'translateY(0)';
    if (dir === 1) {
      if (sPos < sHist.length - 1) sPos++;          // moving forward through history
      else { sHist.push(pendingNext); sPos++; pendingNext = nextRandomIdx(); }
      const upcoming = sPos < sHist.length - 1 ? sHist[sPos + 1] : pendingNext;
      preload(S.panels[roles[2]], REELS[upcoming].id);
    } else {
      sPos--;
      if (sPos > 0) preload(S.panels[roles[0]], REELS[sHist[sPos - 1]].id);
      else clearPanel(S.panels[roles[0]]);          // reached the first short again
    }
    animating = false;
  };
  track.addEventListener('transitionend', done);
  setTimeout(done, 400);                  // safety net if transitionend is swallowed
}

overlayEl.addEventListener('pointerdown', (e) => {
  suppressClick = false;   // reset on every press, in every mode — a stale flag eats taps
  if (currentMode !== 'reels' || animating) return;
  dragStartY = e.clientY;
  track.classList.remove('anim');
});
// Listen on window (not the overlay) so buttons keep receiving normal clicks
window.addEventListener('pointermove', (e) => {
  if (dragStartY === null) return;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dy) > 8) suppressClick = true;
  track.style.transform = 'translateY(' + dy + 'px)';
});
function endDrag(e) {
  if (dragStartY === null) return;
  const dy = e.clientY - dragStartY;
  dragStartY = null;
  if (dy < -60) commitSwipe(1);
  else if (dy > 60) commitSwipe(-1);
  else { track.classList.add('anim'); track.style.transform = 'translateY(0)'; }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

overlayEl.addEventListener('wheel', (e) => {
  if (currentMode !== 'reels') return;
  e.preventDefault();
  if (wheelLock || Math.abs(e.deltaY) < 25) return;
  wheelLock = true;
  setTimeout(() => { wheelLock = false; }, 450);
  commitSwipe(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (currentMode !== 'reels' || overlayEl.classList.contains('hidden')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); commitSwipe(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); commitSwipe(-1); }
});

/* ── Wire up buttons ── */
$('shield').addEventListener('click', () => {
  if (suppressClick) return;
  if ($('stage').classList.contains('hide-ui')) showUi();
  else togglePlay();
});
$('bigPlay').addEventListener('click', togglePlay);
$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', next);
$('prevBtn').addEventListener('click', prev);
$('likeBtn').addEventListener('click', () => $('likeBtn').classList.toggle('liked'));

/* No back buttons: the browser/phone back gesture closes the player instead
   of leaving the site, and Escape works on desktop */
let historyArmed = false, closingFromPop = false;
function armHistory() {
  if (!historyArmed) { history.pushState({ kidtube: 1 }, ''); historyArmed = true; }
}
window.addEventListener('popstate', () => {
  historyArmed = false;
  const playerOpen = !overlayEl.classList.contains('hidden') || !$('watch').classList.contains('hidden');
  if (playerOpen) { closingFromPop = true; closePlayer(); closingFromPop = false; }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!overlayEl.classList.contains('hidden') || !$('watch').classList.contains('hidden')) closePlayer();
});

/* Fullscreen: native API on the stage (controls + shield stay overlaid), CSS fallback elsewhere */
const stageEl = $('stage');
function fsActive() {
  return document.fullscreenElement || document.webkitFullscreenElement || stageEl.classList.contains('fake-fs');
}
function updateFsIcon() { $('fsBtn').classList.toggle('is-fs', !!fsActive()); }
function exitAnyFs() {
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  stageEl.classList.remove('fake-fs');
  updateFsIcon();
}
$('fsBtn').addEventListener('click', () => {
  if (fsActive()) { exitAnyFs(); return; }
  if (stageEl.requestFullscreen) {
    stageEl.requestFullscreen().then(updateFsIcon).catch(() => { stageEl.classList.add('fake-fs'); updateFsIcon(); });
  } else if (stageEl.webkitRequestFullscreen) {
    stageEl.webkitRequestFullscreen(); updateFsIcon();
  } else {
    stageEl.classList.add('fake-fs'); updateFsIcon();
  }
});
document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);

/* Shorts chrome: tap toggles pause like the real Shorts app. Our #sPause
   indicator appears instantly and sits over YouTube's in-iframe play button */
$('sShield').addEventListener('click', () => {
  if (suppressClick || !S.inited) return;
  const pan = S.panels[roles[1]];
  if (!pan || pan.mode !== 'live') return;
  if (pan.p.getPlayerState() === YT.PlayerState.PLAYING) {
    sUserPaused = true;
    $('sPause').classList.remove('hidden');   // show before the pause lands: no flash of YouTube's button
    pan.p.pauseVideo();
  } else {
    sUserPaused = false;
    pan.p.playVideo();
  }
});
$('sPause').addEventListener('click', () => {
  const pan = S.panels[roles[1]];
  if (pan && pan.mode === 'live') { sUserPaused = false; pan.p.playVideo(); }
});
$('sLike').addEventListener('click', () => $('sLike').classList.toggle('liked'));
</script>
</body>
</html>
